<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Sign Up | ZionMelodies</title>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800&family=Playfair+Display:wght@500;600;700;800&display=swap"
        rel="stylesheet">

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <!-- Main CSS -->
    <link rel="stylesheet" href="css/style.css">

    <style>
        body {
            background: #f5faff;
            font-family: 'DM Sans', sans-serif;
        }

        .signup-page {
            min-height: 85vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 60px 15px;
        }

        .signup-card {
            width: 100%;
            max-width: 520px;
            padding: 40px;
            background: #fff;
            border: 1px solid #e6edf3;
            border-radius: 16px;
            box-shadow: 0 12px 40px rgba(30, 70, 100, 0.07);
        }

        .signup-icon {
            width: 65px;
            height: 65px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 20px;
            border-radius: 15px;
            background: #e9f7ff;
            color: #279fd3;
            font-size: 30px;
        }

        .signup-card h1 {
            font-family: 'Playfair Display', serif;
            font-size: 32px;
            font-weight: 700;
            color: #172333;
            text-align: center;
            margin-bottom: 10px;
        }

        .signup-subtitle {
            color: #778392;
            font-size: 14px;
            text-align: center;
            margin-bottom: 30px;
        }

        .signup-card label {
            color: #273647;
            font-size: 14px;
            font-weight: 700;
            margin-bottom: 8px;
        }

        .signup-input {
            height: 47px;
            border: 1px solid #dce5ed;
            border-radius: 8px;
            font-size: 14px;
            box-shadow: none !important;
        }

        .signup-input:focus {
            border-color: #55bce8;
        }

        .password-group .signup-input {
            border-right: 0;
        }

        .password-toggle {
            background: #fff;
            border: 1px solid #dce5ed;
            border-left: 0;
            color: #718096;
            border-radius: 0 8px 8px 0;
        }

        .password-toggle:hover {
            color: #219bd0;
        }

        .terms-label {
            display: flex;
            align-items: flex-start;
            gap: 9px;
            color: #697586 !important;
            font-size: 13px !important;
            font-weight: 500 !important;
            line-height: 1.7;
            margin: 20px 0;
        }

        .terms-label input {
            margin-top: 5px;
            accent-color: #35a8db;
        }

        .terms-label a {
            color: #219bd0;
            text-decoration: none;
            font-weight: 700;
        }

        .signup-submit {
            width: 100%;
            height: 50px;
            background: #39a9dc;
            border: none;
            border-radius: 8px;
            color: #fff;
            font-size: 15px;
            font-weight: 700;
            transition: 0.3s;
        }

        .signup-submit:hover {
            background: #168fc6;
        }

        .signup-message {
            display: none;
            padding: 12px;
            margin-top: 18px;
            background: #eaf7ff;
            color: #176b94;
            border-radius: 8px;
            font-size: 13px;
            text-align: center;
        }

        .login-text {
            text-align: center;
            color: #778392;
            font-size: 14px;
            margin-top: 25px;
            margin-bottom: 0;
        }

        .login-text a {
            color: #219bd0;
            text-decoration: none;
            font-weight: 700;
        }

        .back-home {
            text-align: center;
            margin-top: 22px;
        }

        .back-home a {
            color: #6b7887;
            text-decoration: none;
            font-size: 13px;
        }

        .back-home a:hover {
            color: #219bd0;
        }

        @media (max-width: 480px) {
            .signup-card {
                padding: 28px 20px;
            }

            .signup-card h1 {
                font-size: 28px;
            }
        }
    </style>

</head>

<body>

    <!-- NAVBAR -->

    <nav class="navbar navbar-expand-lg main-navbar sticky-top">
        <div class="container">

            <a class="navbar-brand brand-logo" href="index.html">

                <span class="brand-symbol">
                    <i class="bi bi-music-note-beamed"></i>
                </span>

                <span class="brand-text">
                    Zion<span>Melodies</span>
                    <small>SONGS OF ZION</small>
                </span>

            </a>

            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#mainNavbar"
                aria-controls="mainNavbar" aria-expanded="false" aria-label="Toggle navigation">

                <span class="navbar-toggler-icon"></span>

            </button>

            <div class="collapse navbar-collapse" id="mainNavbar">

                <ul class="navbar-nav ms-auto align-items-lg-center gap-lg-3">

                    <li class="nav-item">
                        <a class="nav-link" href="index.html">HOME</a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link" href="about.html">ABOUT US</a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link" href="songs.html">SONGS</a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link" href="keyboard-notes.html">KEYBOARD NOTES</a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link search-link" href="songs.html">
                            <i class="bi bi-search"></i>
                        </a>
                    </li>

                </ul>

            </div>
        </div>
    </nav>


    <!-- SIGNUP SECTION -->

    <main class="signup-page">

        <div class="signup-card">

            <div class="signup-icon">
                <i class="bi bi-person-plus-fill"></i>
            </div>

            <h1>Create Account</h1>

            <p class="signup-subtitle">
                Join ZionMelodies and explore the joy of worship.
            </p>


            <form id="signupForm">

                <!-- FULL NAME -->

                <div class="mb-3">

                    <label for="fullName">Full Name</label>

                    <input type="text" class="form-control signup-input" id="fullName"
                        placeholder="Enter your full name" autocomplete="name" required>

                </div>


                <!-- EMAIL -->

                <div class="mb-3">

                    <label for="email">Email Address</label>

                    <input type="email" class="form-control signup-input" id="email"
                        placeholder="Enter your email address" autocomplete="email" required>

                </div>


                <!-- PHONE -->

                <div class="mb-3">

                    <label for="phone">Phone Number</label>

                    <input type="tel" class="form-control signup-input" id="phone" placeholder="Enter your phone number"
                        autocomplete="tel" pattern="[0-9]{10}" maxlength="10" required>

                </div>


                <!-- PASSWORD -->

                <div class="mb-3">

                    <label for="password">Password</label>

                    <div class="input-group password-group">

                        <input type="password" class="form-control signup-input" id="password"
                            placeholder="Create a password" autocomplete="new-password" minlength="8" required>

                        <button type="button" class="btn password-toggle" data-target="password"
                            aria-label="Show password">

                            <i class="bi bi-eye"></i>

                        </button>

                    </div>

                </div>


                <!-- CONFIRM PASSWORD -->

                <div class="mb-3">

                    <label for="confirmPassword">Confirm Password</label>

                    <div class="input-group password-group">

                        <input type="password" class="form-control signup-input" id="confirmPassword"
                            placeholder="Confirm your password" autocomplete="new-password" minlength="8" required>

                        <button type="button" class="btn password-toggle" data-target="confirmPassword"
                            aria-label="Show password">

                            <i class="bi bi-eye"></i>

                        </button>

                    </div>

                </div>


                <!-- TERMS -->

                <label class="terms-label">

                    <input type="checkbox" id="terms" required>

                    <span>
                        I agree to the
                        <a href="#" id="termsLink">Terms &amp; Conditions</a>
                        and Privacy Policy.
                    </span>

                </label>


                <!-- SUBMIT -->

                <button type="submit" class="signup-submit">
                    CREATE ACCOUNT
                    <i class="bi bi-arrow-right ms-2"></i>
                </button>

                <div class="signup-message" id="signupMessage"></div>

            </form>


            <p class="login-text">
                Already have an account?
                <a href="login.html">Login</a>
            </p>


            <div class="back-home">

                <a href="index.html">
                    <i class="bi bi-arrow-left me-2"></i>
                    Back to Home
                </a>

            </div>

        </div>

    </main>


    <!-- FOOTER -->

    <footer class="site-footer">

        <div class="footer-bottom">

            <div class="container d-flex flex-wrap justify-content-between
                        align-items-center gap-2">

                <p class="mb-0">
                    © <span id="currentYear"></span> ZionMelodies.
                    All rights reserved.
                </p>

                <p class="glory-text mb-0">
                    For His Glory <span>✝</span>
                </p>

            </div>

        </div>

    </footer>


    <!-- JAVASCRIPT -->

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

    <script src="js/main.js"></script>

    <script>

        // Current year
        document.getElementById("currentYear").textContent =
            new Date().getFullYear();


        // Show / Hide Password
        document.querySelectorAll(".password-toggle").forEach(function (button) {

            button.addEventListener("click", function () {

                const targetId = this.getAttribute("data-target");
                const passwordField = document.getElementById(targetId);
                const icon = this.querySelector("i");

                if (passwordField.type === "password") {

                    passwordField.type = "text";
                    icon.className = "bi bi-eye-slash";
                    this.setAttribute("aria-label", "Hide password");

                } else {

                    passwordField.type = "password";
                    icon.className = "bi bi-eye";
                    this.setAttribute("aria-label", "Show password");

                }

            });

        });


        // Frontend Signup Demonstration
        const signupForm = document.getElementById("signupForm");
        const signupMessage = document.getElementById("signupMessage");

        signupForm.addEventListener("submit", function (event) {

            event.preventDefault();

            const password = document.getElementById("password").value;
            const confirmPassword = document.getElementById("confirmPassword").value;

            signupMessage.style.display = "block";

            if (password !== confirmPassword) {

                signupMessage.textContent = "Passwords do not match.";
                signupMessage.style.background = "#fff0f0";
                signupMessage.style.color = "#b42318";

                return;

            }

            signupMessage.style.background = "#eaf7ff";
            signupMessage.style.color = "#176b94";

            signupMessage.textContent =
                "Account Created Successfully.";

        });


        // Terms demonstration
        document.getElementById("termsLink").addEventListener("click", function (event) {

            event.preventDefault();

            alert("Terms & Conditions will be added soon.");

        });

    </script>

</body>

</html>
