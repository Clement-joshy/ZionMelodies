<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login | ZionMelodies</title>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800&family=Playfair+Display:wght@500;600;700;800&display=swap"
        rel="stylesheet">

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <!-- Main CSS -->
    <link rel="stylesheet" href="css/style.css">

    <style>
        body {
            background: #f5faff;
            font-family: 'DM Sans', sans-serif;
        }

        .login-page {
            min-height: 78vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 65px 15px;
        }

        .login-card {
            width: 100%;
            max-width: 460px;
            background: #fff;
            padding: 42px;
            border-radius: 16px;
            border: 1px solid #e6edf3;
            box-shadow: 0 12px 40px rgba(30, 70, 100, 0.07);
        }

        .login-icon {
            width: 65px;
            height: 65px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #e9f7ff;
            color: #279fd3;
            border-radius: 15px;
            font-size: 30px;
            margin: 0 auto 22px;
        }

        .login-card h1 {
            font-family: 'Playfair Display', serif;
            font-size: 32px;
            font-weight: 700;
            text-align: center;
            color: #172333;
            margin-bottom: 10px;
        }

        .login-subtitle {
            text-align: center;
            color: #778392;
            font-size: 14px;
            margin-bottom: 32px;
        }

        .login-card label {
            font-size: 14px;
            font-weight: 700;
            color: #273647;
            margin-bottom: 9px;
        }

        .login-input {
            height: 49px;
            border: 1px solid #dce5ed;
            border-radius: 8px;
            font-size: 14px;
            box-shadow: none !important;
        }

        .login-input:focus {
            border-color: #55bce8;
        }

        .input-group .login-input {
            border-right: 0;
        }

        .password-toggle {
            border: 1px solid #dce5ed;
            border-left: 0;
            background: #fff;
            color: #718096;
            border-radius: 0 8px 8px 0;
        }

        .password-toggle:hover {
            color: #249bd1;
        }

        .login-options {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 10px;
            margin: 20px 0 25px;
            font-size: 13px;
        }

        .login-options a {
            color: #229bd0;
            text-decoration: none;
            font-weight: 600;
        }

        .login-options a:hover {
            text-decoration: underline;
        }

        .remember-label {
            display: flex;
            align-items: center;
            gap: 7px;
            color: #697586 !important;
            font-weight: 500 !important;
            margin: 0;
        }

        .remember-label input {
            accent-color: #35a8db;
        }

        .login-submit {
            width: 100%;
            height: 50px;
            background: #39a9dc;
            color: #fff;
            border: none;
            border-radius: 8px;
            font-weight: 700;
            font-size: 15px;
            transition: 0.3s;
        }

        .login-submit:hover {
            background: #168fc6;
        }

        .login-message {
            display: none;
            margin-top: 18px;
            padding: 12px;
            border-radius: 8px;
            background: #eaf7ff;
            color: #176b94;
            font-size: 13px;
            text-align: center;
        }

        .signup-text {
            text-align: center;
            color: #778392;
            font-size: 14px;
            margin-top: 25px;
            margin-bottom: 0;
        }

        .signup-text a {
            color: #219bd0;
            text-decoration: none;
            font-weight: 700;
        }

        .login-divider {
            text-align: center;
            color: #a0aab5;
            font-size: 12px;
            margin: 25px 0;
        }

        .back-home {
            text-align: center;
            margin-top: 25px;
        }

        .back-home a {
            color: #6b7887;
            text-decoration: none;
            font-size: 13px;
        }

        .back-home a:hover {
            color: #219bd0;
        }

        @media (max-width: 480px) {
            .login-card {
                padding: 30px 22px;
            }

            .login-card h1 {
                font-size: 28px;
            }
        }
    </style>

</head>

<body>

    <!-- NAVBAR -->

    <nav class="navbar navbar-expand-lg main-navbar sticky-top">
        <div class="container">

            <a class="navbar-brand brand-logo" href="index.html">

                <span class="brand-symbol">
                    <i class="bi bi-music-note-beamed"></i>
                </span>

                <span class="brand-text">
                    Zion<span>Melodies</span>
                    <small>SONGS OF ZION</small>
                </span>

            </a>

            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#mainNavbar"
                aria-controls="mainNavbar" aria-expanded="false" aria-label="Toggle navigation">

                <span class="navbar-toggler-icon"></span>

            </button>

            <div class="collapse navbar-collapse" id="mainNavbar">

                <ul class="navbar-nav ms-auto align-items-lg-center gap-lg-3">

                    <li class="nav-item">
                        <a class="nav-link" href="index.html">HOME</a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link" href="about.html">ABOUT US</a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link" href="songs.html">SONGS</a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link" href="keyboard-notes.html">KEYBOARD NOTES</a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link search-link" href="songs.html">
                            <i class="bi bi-search"></i>
                        </a>
                    </li>

                </ul>

            </div>
        </div>
    </nav>


    <!-- LOGIN SECTION -->

    <main class="login-page">

        <div class="login-card">

            <div class="login-icon">
                <i class="bi bi-person-fill"></i>
            </div>

            <h1>Welcome Back!</h1>

            <p class="login-subtitle">
                Login to continue your ZionMelodies journey.
            </p>

            <form id="loginForm">

                <div class="mb-4">

                    <label for="loginIdentity">
                        Email Address or Phone Number
                    </label>

                    <input type="text" class="form-control login-input" id="loginIdentity"
                        placeholder="Enter your email or phone number" required>

                </div>


                <div class="mb-2">

                    <label for="loginPassword">
                        Password
                    </label>

                    <div class="input-group">

                        <input type="password" class="form-control login-input" id="loginPassword"
                            placeholder="Enter your password" required>

                        <button class="btn password-toggle" type="button" id="togglePassword"
                            aria-label="Show password">

                            <i class="bi bi-eye" id="passwordIcon"></i>

                        </button>

                    </div>

                </div>


                <div class="login-options">

                    <label class="remember-label">
                        <input type="checkbox" id="rememberMe">
                        Remember me
                    </label>

                    <a href="#" id="forgotPassword">
                        Forgot Password?
                    </a>

                </div>


                <button type="submit" class="login-submit">
                    LOGIN
                    <i class="bi bi-arrow-right ms-2"></i>
                </button>

                <div class="login-message" id="loginMessage"></div>

            </form>


            <div class="login-divider">
                ─────────────── OR ───────────────
            </div>


            <p class="signup-text">
                Don't have an account?
                <a href="signup.html">Create Account</a>
            </p>


            <div class="back-home">
                <a href="index.html">
                    <i class="bi bi-arrow-left me-2"></i>
                    Back to Home
                </a>
            </div>

        </div>

    </main>


    <!-- FOOTER -->

    <footer class="site-footer">

        <div class="footer-bottom">

            <div class="container d-flex flex-wrap justify-content-between
                        align-items-center gap-2">

                <p class="mb-0">
                    © <span id="currentYear"></span> ZionMelodies.
                    All rights reserved.
                </p>

                <p class="glory-text mb-0">
                    For His Glory <span>✝</span>
                </p>

            </div>

        </div>

    </footer>


    <!-- JAVASCRIPT -->

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

    <script src="js/main.js"></script>

    <script>

        // Current year
        document.getElementById("currentYear").textContent =
            new Date().getFullYear();


        // Show / Hide Password
        const passwordInput = document.getElementById("loginPassword");
        const togglePassword = document.getElementById("togglePassword");
        const passwordIcon = document.getElementById("passwordIcon");

        togglePassword.addEventListener("click", function () {

            if (passwordInput.type === "password") {

                passwordInput.type = "text";
                passwordIcon.className = "bi bi-eye-slash";
                togglePassword.setAttribute("aria-label", "Hide password");

            } else {

                passwordInput.type = "password";
                passwordIcon.className = "bi bi-eye";
                togglePassword.setAttribute("aria-label", "Show password");

            }

        });


        // Frontend Login Demonstration
        const loginForm = document.getElementById("loginForm");
        const loginMessage = document.getElementById("loginMessage");

        loginForm.addEventListener("submit", function (event) {

            event.preventDefault();

            loginMessage.style.display = "block";

            loginMessage.textContent =
                "login successfully";

        });


        // Forgot Password Demonstration
        document.getElementById("forgotPassword").addEventListener("click", function (event) {

            event.preventDefault();

            loginMessage.style.display = "block";

            loginMessage.textContent =
                "Password recovery will be available when account services are connected.";

        });

    </script>

</body>

</html>
