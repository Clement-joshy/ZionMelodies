<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Song Details | ZionMelodies</title>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@600;700&display=swap"
        rel="stylesheet">

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <!-- Website CSS -->
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/song-details.css">
</head>

<body>

    <!-- NAVBAR -->
    <nav class="navbar navbar-expand-lg main-navbar">
        <div class="container">

            <a class="navbar-brand brand-logo" href="index.html">
                <span class="brand-symbol">
                    <i class="bi bi-music-note-beamed"></i>
                </span>

                <span class="brand-text">
                    Zion<span>Melodies</span>
                    <small>SONGS OF ZION</small>
                </span>
            </a>

            <a href="songs.html" class="back-to-songs">
                <i class="bi bi-arrow-left"></i>
                Back to Songs
            </a>

        </div>
    </nav>


    <!-- SONG DETAILS -->
    <main class="song-details-section">

        <div class="container">

            <div class="song-details-card">

                <span class="song-number" id="detailSongNumber">
                    SONG NO. 001
                </span>

                <h1 id="detailSongTitle">
                    Song Title
                </h1>

                <div class="song-divider"></div>

                <div class="lyrics-heading">
                    <i class="bi bi-music-note-list"></i>
                    <h2>Song Lyrics</h2>
                </div>

                <div class="song-lyrics" id="songLyrics">
                    <p>Song lyrics will appear here.</p>
                </div>

                <div class="song-audio-section">
                    <h3>
                        <i class="bi bi-headphones"></i>
                        Listen to Song
                    </h3>

                    <audio id="songAudio" controls>
                        Your browser does not support audio playback.
                    </audio>
                </div>

                <a href="songs.html" class="back-button">
                    <i class="bi bi-arrow-left"></i>
                    Back to Songs Library
                </a>

            </div>

        </div>

    </main>


    <!-- FOOTER -->
    <footer class="songs-footer">
        <div class="container text-center">
            <h3>Zion<span>Melodies</span></h3>
            <p>Sharing songs of faith, hope and worship.</p>
            <small>
                © <span id="currentYear"></span> ZionMelodies.
                All rights reserved.
            </small>
        </div>
    </footer>


    <script src="js/main.js"></script>
    <script src="js/song-details.js"></script>

</body>

</html>
